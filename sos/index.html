<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo API SOS - Central Macatuba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
    <h1>Exemplo API SOS</h1>
    <p>Consulte alertas de emergência ativos.</p>
    
    <button onclick="listar()">Listar Alertas</button>

    <pre id="resultado">Os resultados aparecerão aqui...</pre>

    <script>
        async function listar() {
            const res = await fetch(`https://publica.api.centralmacatuba.eu.org/sos/listar_alertas.php`);
            const data = await res.json();
            document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
        }
    </script>
    <p><a href="../">Voltar para a Home</a></p>
</body>
</html>
