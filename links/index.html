<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo API Links - Central Macatuba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
    <h1>Exemplo API Links</h1>
    <p>Pesquise links úteis da Central Macatuba.</p>
    
    <input type="text" id="termo" placeholder="Digite o termo...">
    <button onclick="pesquisar()">Pesquisar</button>

    <pre id="resultado">Os resultados aparecerão aqui...</pre>

    <script>
        async function pesquisar() {
            const termo = document.getElementById('termo').value;
            const res = await fetch(`https://publica.api.centralmacatuba.eu.org/links/pesquisar.php?termo=${encodeURIComponent(termo)}`);
            const data = await res.json();
            document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
        }
    </script>
    <p><a href="../">Voltar para a Home</a></p>
</body>
</html>
