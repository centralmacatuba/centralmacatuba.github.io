<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo API Tempo - Central Macatuba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
<style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #000000;
            background-color: #FFFFFF;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #FF0000;
            padding-bottom: 20px;
        }
        h1 {
            color: #FF0000;
            margin-bottom: 10px;
        }
        h2 {
            color: #FF0000;
            border-left: 4px solid #FF0000;
            padding-left: 15px;
            margin-top: 30px;
        }
        h3, h4, h5, h6 {
            color: #FF0000;
        }
        .subtitle {
            font-size: 1.1em;
            color: #000000;
        }
        .section {
            margin-bottom: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #FFFFFF;
        }
        th, td {
            border: 1px solid #000000;
            padding: 12px;
            text-align: left;
            color: #000000;
            background-color: #FFFFFF;
        }
        th {
            background-color: #FF0000;
            font-weight: bold;
            color: #FFFFFF;
        }
        tr:nth-child(even) {
            background-color: #F5F5F5;
        }
        a {
            color: #FF0000;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
            color: #CC0000;
        }
        button {
            background-color: #FF0000;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
        }
        button:hover {
            background-color: #CC0000;
        }
        pre {
            background-color: #F5F5F5;
            border: 1px solid #FF0000;
            border-left: 4px solid #FF0000;
            padding: 15px;
            overflow-x: auto;
            color: #000000;
        }
        code {
            background-color: #F5F5F5;
            color: #000000;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #FF0000;
            color: #000000;
            font-size: 0.9em;
        }
        input, textarea, select {
            background-color: #FFFFFF;
            color: #000000;
            border: 1px solid #FF0000;
            padding: 8px;
            border-radius: 3px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #CC0000;
            box-shadow: 0 0 5px #FF0000;
        }
</style>
    </head>
<body>
    <h1>Exemplo API Tempo</h1>
    <p>Exemplo de integração com o serviço Tempo.</p>
    
    <button onclick="testar()">Testar API</button>

    <pre id="resultado">Os resultados aparecerão aqui...</pre>

    <script>
        async function testar() {
            try {
                const res = await fetch('https://publica.api.centralmacatuba.eu.org/tempo/verificar.php');
                const data = await res.json();
                document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('resultado').textContent = 'Erro ao conectar com a API pública.';
            }
        }
    </script>
    <p><a href="../">Voltar para a Home</a></p>
</body>
</html>
