<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo API Status - Central Macatuba</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
    <h1>Exemplo API Status</h1>
    <p>Verifique a saúde dos serviços da Central Macatuba.</p>
    
    <button onclick="verificar()">Verificar Status Geral</button>

    <pre id="resultado">Os resultados aparecerão aqui...</pre>

    <script>
        async function verificar() {
            const res = await fetch(`https://publica.api.centralmacatuba.eu.org/status/verificar.php?tipo=tudo`);
            const data = await res.json();
            document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
        }
    </script>
    <p><a href="../">Voltar para a Home</a></p>
</body>
</html>
